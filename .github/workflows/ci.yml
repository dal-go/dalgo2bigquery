name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true
      - shell: bash
        run: go test -race -covermode=atomic -coverprofile=profile.cov ./...
      - shell: bash
        run: |
          awk '$1 != "mode:" && $3 == 0 { print "UNCOVERED: " $1 " (" $2 " stmts)"; uncovered += $2 } END { if (uncovered > 0) { printf "uncovered statements: %d\n", uncovered; exit 1 } }' profile.cov
          total=$(go tool cover -func=profile.cov | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          awk -v total="$total" -v min_test_coverage_percent="100" 'BEGIN { if (total + 0 < min_test_coverage_percent + 0) { printf "coverage %s%% is below %s%%\n", total, min_test_coverage_percent; exit 1 } }'
      - shell: bash
        run: go vet ./...
      - shell: bash
        run: test -z "$(gofmt -l .)"
